<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式直立樹狀圖 - 空間測量業務架構</title>
	
	<script src="core-guard.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --note-width: 360px;
            --note-gap: 22px;
        }

		body {
			font-family: 'Noto Sans TC', sans-serif;
			background-color: #f4f7fa;
			color: #333;
			margin: 0;
			padding: 18px 20px 28px;
			-webkit-font-smoothing: antialiased;
			-moz-osx-font-smoothing: grayscale;
			text-rendering: optimizeLegibility;
		}

        /* 主工作區預留右側便條紙空間，表單與樹狀圖不會被覆蓋 */
        #mainWorkspace {
            width: calc(100% - var(--note-width) - var(--note-gap));
            min-width: 0;
            max-width: 1920px;
        }

        .header-container {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
        }

        h1 {
            color: #003366;
            margin-bottom: 5px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        p.subtitle {
            color: #666;
            font-size: 0.9em;
            margin-top: 0;
        }

        .instruction {
            background-color: #eaf2f8;
            color: #0055A4;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85em;
            display: inline-block;
            margin-bottom: 10px;
            border: 1px solid #d4e6f1;
        }

        /* 業主資料表單 */
        .client-form {
            display: grid;
            grid-template-columns: repeat(4, minmax(130px, 1fr)) minmax(150px, 0.9fr);
            gap: 12px;
            width: 100%;
            margin: 14px 0 16px;
            padding: 15px;
            background: #ffffff;
            border: 1px solid #dce5ee;
            border-radius: 12px;
            box-shadow: 0 5px 18px rgba(0, 51, 102, 0.05);
        }

        .form-field {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 7px;
            min-width: 0;
        }

        .form-field > label,
        .form-field .field-title {
            color: #34495e;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .form-field input[type="text"],
        .form-field input[type="tel"],
        .form-field input[type="email"] {
            width: 100%;
            min-width: 0;
            height: 40px;
            padding: 8px 11px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            outline: none;
            background: #fbfdff;
            color: #263746;
            font: inherit;
            font-size: 14px;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .form-field input:focus {
            border-color: #3685c5;
            box-shadow: 0 0 0 3px rgba(54, 133, 197, 0.13);
            background: #ffffff;
        }

        .form-field input::placeholder {
            color: #9aa5b1;
            opacity: 1;
        }

        .document-options {
            display: flex;
            align-items: center;
            gap: 16px;
            min-height: 40px;
            padding: 0 2px;
        }

        .document-options label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #34495e;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }

        .document-options input[type="radio"] {
            width: 16px;
            height: 16px;
            margin: 0;
            accent-color: #0055A4;
            cursor: pointer;
        }

        /* 左下角方形切換鈕：停用／啟用需求釐清與右側便條紙 */
        #requirementToggleBtn {
            position: fixed;
            z-index: 1200;
            left: 18px;
            bottom: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 54px;
            height: 54px;
            padding: 0;
            border: 1px solid #004681;
            border-radius: 10px;
            background: #0055A4;
            color: #ffffff;
            font-family: inherit;
            font-size: 25px;
            line-height: 1;
            cursor: pointer;
            box-shadow: 0 5px 16px rgba(0, 51, 102, 0.24);
            transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        #requirementToggleBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 51, 102, 0.28);
        }

        #requirementToggleBtn.active {
            background: #d97706;
            border-color: #b96500;
        }

        #requirementToggleBtn::after {
            content: attr(data-tooltip);
            position: absolute;
            left: calc(100% + 10px);
            bottom: 50%;
            transform: translateY(50%);
            width: max-content;
            max-width: 240px;
            padding: 8px 10px;
            border-radius: 6px;
            background: rgba(34, 45, 58, 0.96);
            color: #ffffff;
            font-size: 12px;
            font-weight: 500;
            line-height: 1.4;
            letter-spacing: 0;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }

        #requirementToggleBtn:hover::after,
        #requirementToggleBtn:focus-visible::after {
            opacity: 1;
            visibility: visible;
        }

        .scroll-wrapper {
            width: 100%;
            max-width: 1920px;
            overflow-x: auto;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 51, 102, 0.06);
            background-color: #ffffff;
            position: relative;
        }

        .scroll-wrapper::-webkit-scrollbar {
            height: 10px;
        }

        .scroll-wrapper::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 0 0 12px 12px;
        }

        .scroll-wrapper::-webkit-scrollbar-thumb {
            background: #0055A4;
            border-radius: 10px;
        }

        .scroll-wrapper::-webkit-scrollbar-thumb:hover {
            background: #003366;
        }

        #tree-container {
            width: 3600px;
            height: 80vh;
            min-height: 680px;
        }

        /* 右側長條便條紙：固定於視窗，不可拖曳或縮放 */
        #notePanel {
            position: fixed;
            z-index: 999;
            top: 16px;
            right: 16px;
            bottom: 16px;
            width: var(--note-width);
            min-width: 0;
            min-height: 0;
            max-width: calc(100vw - 32px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: #fff8a8;
            border: 1px solid #d8c85a;
            border-radius: 8px;
            box-shadow: 0 10px 28px rgba(72, 63, 0, 0.18);
        }

        #notePanel.hidden {
            display: none;
        }

        .note-header {
            flex: 0 0 auto;
            padding: 14px 16px 12px;
            user-select: none;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.25) 25%, transparent 25%) -12px 0/24px 24px,
                #f4e778;
            border-bottom: 1px dashed #c4b440;
            position: relative;
        }

        .note-header::before {
            content: "";
            position: absolute;
            width: 86px;
            height: 18px;
            top: -8px;
            left: 50%;
            transform: translateX(-50%) rotate(-2deg);
            background: rgba(255, 240, 160, 0.8);
            border: 1px solid rgba(190, 170, 70, 0.35);
        }

        .note-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .note-title {
            margin: 0;
            color: #594f00;
            font-size: 21px;
            font-weight: 700;
        }

        .note-counter {
            font-size: 15px;
            color: #6a5e00;
            white-space: nowrap;
        }

        .note-body {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding: 12px 14px 14px;
        }

        .note-empty {
            padding: 30px 14px;
            text-align: center;
            color: #776f2c;
            line-height: 1.7;
            font-size: 16px;
        }

        .note-group {
            margin-bottom: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.42);
            border: 1px solid rgba(180, 166, 70, 0.45);
            border-radius: 8px;
        }

        .note-group:last-child {
            margin-bottom: 0;
        }

        .note-category-heading {
            margin: 4px 0 8px;
            padding: 8px 10px;
            border-radius: 6px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.45;
            box-shadow: 0 2px 5px rgba(72, 63, 0, 0.10);
        }

        .note-category-heading.cat-a { background: #0077b6; }
        .note-category-heading.cat-b { background: #d96549; }
        .note-category-heading.cat-c { background: #238a7e; }
        .note-category-heading.cat-d { background: #7D3C98; }

        .note-subcategory-heading {
            margin: 10px 3px 6px;
            padding: 4px 7px;
            border-left: 3px solid #c4b440;
            border-radius: 0 4px 4px 0;
            background: rgba(255, 255, 255, 0.25);
            color: #594f00;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }

        .note-group-title {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
            color: #4a4300;
            font-weight: 700;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 6px;
        }

        .remove-item-btn {
            flex: 0 0 auto;
            border: none;
            background: transparent;
            color: #8c7d00;
            cursor: pointer;
            font-size: 17px;
            line-height: 1;
            padding: 1px 3px;
        }

        .remove-item-btn:hover {
            color: #b42318;
        }

        .note-question {
            margin: 7px 0 0 4px;
            padding-left: 5px;
            color: #4c470b;
            font-size: 15px;
            line-height: 1.75;
            overflow-wrap: anywhere;
        }

        .note-question code {
            font-family: 'Noto Sans TC', sans-serif;
            font-weight: 700;
            color: #7b5b00;
        }

        /* 每道需求問題下方的業主文字回覆欄位 */
        .note-question-block {
            margin: 10px 0 14px;
            padding: 0 3px;
        }

        .note-answer-label {
            display: block;
            margin: 7px 0 5px 5px;
            color: #6a5e00;
            font-size: 12px;
            font-weight: 700;
        }

        .note-answer-input {
            display: block;
            width: 100%;
            min-height: 64px;
            padding: 8px 10px;
            border: 1px solid #d5c665;
            border-radius: 7px;
            outline: none;
            background: rgba(255, 255, 255, 0.82);
            color: #37320a;
            font: inherit;
            font-size: 13px;
            line-height: 1.55;
            resize: vertical;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }

        .note-answer-input::placeholder {
            color: #a39a5b;
        }

        .note-answer-input:focus {
            border-color: #9d8b16;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(157, 139, 22, 0.14);
        }

        .note-answer-input.is-locked,
        .note-answer-input.is-locked:focus {
            background: rgba(237, 232, 197, 0.72);
            border-color: #a99b47;
            color: #514b24;
            box-shadow: none;
            cursor: not-allowed;
        }

        .note-answer-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin: 6px 0 0 2px;
        }

        .note-answer-lock-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 9px;
            border: 1px solid #b6a52c;
            border-radius: 6px;
            background: rgba(255,255,255,0.62);
            color: #625800;
            font-family: inherit;
            font-size: 12px;
            line-height: 1.3;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .note-answer-lock-btn:hover {
            background: #fffdf0;
        }

        .note-answer-lock-btn.is-locked {
            border-color: #81906a;
            background: #e5ecd9;
            color: #37512a;
        }

        .note-answer-lock-btn.is-locked:hover {
            background: #f0f5e9;
        }

        .note-answer-lock-status {
            color: #756c2d;
            font-size: 11px;
            line-height: 1.4;
            text-align: right;
        }

        .note-answer-lock-status.is-locked {
            color: #37512a;
            font-weight: 700;
        }

        .note-footer {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            padding: 9px 12px 11px;
            border-top: 1px dashed #c4b440;
            background: rgba(255, 247, 170, 0.78);
        }

        .note-clear-btn {
            border: 1px solid #b6a52c;
            background: rgba(255,255,255,0.5);
            color: #625800;
            border-radius: 8px;
            padding: 7px 11px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
        }

        .note-clear-btn:hover {
            background: #fffdf0;
        }

        @media (max-width: 1200px) {
            :root {
                --note-width: 320px;
                --note-gap: 18px;
            }

            .client-form {
                grid-template-columns: repeat(3, minmax(130px, 1fr));
            }
        }

        @media (max-width: 1000px) {
            .client-form {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .document-field {
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 760px) {
            :root {
                --note-width: min(280px, 46vw);
                --note-gap: 12px;
            }

            body {
                padding: 14px 12px 86px;
            }

            /* 窄螢幕仍將便條紙固定在右側，主工作區持續保留其寬度 */
            #mainWorkspace {
                width: calc(100% - var(--note-width) - var(--note-gap));
            }

            #notePanel {
                top: 12px;
                right: 12px;
                bottom: 12px;
                left: auto;
                width: var(--note-width);
                height: auto;
                max-width: calc(100vw - 24px);
            }

            .client-form {
                grid-template-columns: minmax(0, 1fr);
                gap: 10px;
                padding: 12px;
            }

            .document-field {
                grid-column: auto;
            }

            #requirementToggleBtn {
                left: 12px;
                bottom: 12px;
                width: 48px;
                height: 48px;
            }

            #requirementToggleBtn::after {
                left: calc(100% + 8px);
                font-size: 11px;
            }

            #tree-container {
                min-height: 620px;
                height: 72vh;
            }
        }
    </style>
</head>

<body>
    <main id="mainWorkspace">
        <div class="header-container">
            <h1>空間測量完整工項架構</h1>
            <p class="subtitle">直立互動式動態圖譜</p>

            <div class="instruction">
                💡 提示：點擊節點【收合/展開】，支援滑鼠拖曳漫遊；需求釐清啟用時，可複選最末端工項，並可在右側便條紙逐題填寫業主回覆。
            </div>
        </div>

        <form id="clientInfoForm" class="client-form" autocomplete="off" aria-label="業主聯絡資料">
            <div class="form-field">
                <label for="companyName">公司名稱</label>
                <input id="companyName" name="companyName" type="text" placeholder="無">
            </div>
            <div class="form-field">
                <label for="contactPerson">聯絡人</label>
                <input id="contactPerson" name="contactPerson" type="text" placeholder="王曉明">
            </div>
            <div class="form-field">
                <label for="phoneNumber">電話號碼</label>
                <input id="phoneNumber" name="phoneNumber" type="tel" placeholder="0900-000-123">
            </div>
            <div class="form-field">
                <label for="emailAddress">電子郵件</label>
                <input id="emailAddress" name="emailAddress" type="email" placeholder="qwe246123@gmail.com">
            </div>
            <fieldset class="form-field document-field" style="border:0; margin:0; padding:0;">
                <legend class="field-title">業主提供文件</legend>
                <div class="document-options">
                    <label for="documentsYes"><input id="documentsYes" name="documentsProvided" type="radio" value="有">有</label>
                    <label for="documentsNo"><input id="documentsNo" name="documentsProvided" type="radio" value="無">無</label>
                </div>
            </fieldset>
        </form>

        <div class="scroll-wrapper" id="scrollWrap">
            <div id="tree-container"></div>
        </div>
    </main>

    <!-- 需求釐清便條紙 -->
    <aside id="notePanel" aria-live="polite">
        <div class="note-header">
            <div class="note-title-row">
                <h2 class="note-title">📝 測量需求釐清</h2>
                <span id="noteCounter" class="note-counter">已選 0 項</span>
            </div>
        </div>

        <div id="noteBody" class="note-body">
            <div class="note-empty">
                尚未選擇任何末端工項。<br>
                請在需求釐清模式下點選節點。
            </div>
        </div>

        <div class="note-footer">
            <button id="submitToSheetBtn" class="note-clear-btn" type="button" style="background:#0055A4; color:#fff; border-color:#003366;">確認送出表單</button>
    	    <button id="clearSelectedBtn" class="note-clear-btn" type="button">清除全部</button>
        </div>
    </aside>

    <button id="requirementToggleBtn" type="button" class="active"
        data-tooltip="關閉 / 開啟測量需求釐清"
        title="關閉 / 開啟測量需求釐清"
        aria-label="關閉 / 開啟測量需求釐清"
        aria-pressed="true">📝</button>

    <script>
		var dom = document.getElementById('tree-container');
		var myChart = echarts.init(dom, null, {
			renderer: 'canvas',
			useDirtyRect: false,
			devicePixelRatio: Math.max(window.devicePixelRatio || 1, 2) // 強制以高解析度渲染文字
		});

        // =========================================================
        // 需求問題資料：以唯一 ID 綁定末端節點，避免重複名稱互相誤選
        // =========================================================
        // 問題文字、類別與順序均依「工項確認問題統計.xlsx」工作表1逐列建立。
        var requirementQuestionMap = {
            "A-1-1": {
                "name": "1. 控制點清查與佈設",
                "category": "A.基礎控制類",
                "categoryCode": "A",
                "categoryClass": "cat-a",
                "subcategory": "A-1.控制測量",
                "order": 0,
                "questions": [
                    {
                        "label": "Q1.",
                        "text": "測區內是否需要環境清潔（如雜草樹木茂盛），會影響通視或衛星訊號遮擋等問題嗎？"
                    },
                    {
                        "label": "Q2.",
                        "text": "佈設新點位應為：導線釘、鋼片樁、木樁或是水泥樁？"
                    }
                ]
            },
            "A-1-2": {
                "name": "2. 靜態GPS測量",
                "category": "A.基礎控制類",
                "categoryCode": "A",
                "categoryClass": "cat-a",
                "subcategory": "A-1.控制測量",
                "order": 1,
                "questions": [
                    {
                        "label": "Q1.",
                        "text": "有無關於測量精度規範說明等文件？\n平面坐標系統：TWD97[1997 / 2010 / 2020]\n高程坐標系統：橢球高、TWVD2001"
                    },
                    {
                        "label": "Q2.",
                        "text": "有無必須檢測的已知控制點？\n若有：詢問是否有坐標資料能提供。"
                    }
                ]
            },
            "A-1-3": {
                "name": "3. 導線測量(平面)",
                "category": "A.基礎控制類",
                "categoryCode": "A",
                "categoryClass": "cat-a",
                "subcategory": "A-1.控制測量",
                "order": 2,
                "questions": [
                    {
                        "label": "Q1.",
                        "text": "有無關於測量(導線)精度規範說明等文件？\n平面坐標系統：TWD97[1997 / 2010 / 2020]"
                    },
                    {
                        "label": "Q2.",
                        "text": "有無必須檢測的已知控制點？\n若有：詢問是否有坐標資料能提供。"
                    }
                ]
            },
            "A-1-4": {
                "name": "4. 水準測量(高程)",
                "category": "A.基礎控制類",
                "categoryCode": "A",
                "categoryClass": "cat-a",
                "subcategory": "A-1.控制測量",
                "order": 3,
                "questions": [
                    {
                        "label": "Q1.",
                        "text": "有無關於水準測量精度規範說明等文件？\n高程坐標系統：TWVD2001"
                    },
                    {
                        "label": "Q2.",
                        "text": "有無必須檢測的已知高程點？\n若有：詢問是否有坐標資料能提供。"
                    }
                ]
            },
            "A-1-5": {
                "name": "5. VRS-RTK(e-GNSS 180筆)",
                "category": "A.基礎控制類",
                "categoryCode": "A",
                "categoryClass": "cat-a",
                "subcategory": "A-1.控制測量",
                "order": 4,
                "questions": [
                    {
                        "label": "Q1.",

        // =========================================================
        // 串接 Google 試算表送出邏輯
        // 注意：後端 Apps Script 需同步更新，才能將每一道問題寫入「需求問答明細」工作表。
        // =========================================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwm7yp2ZSmXZx0oWb-MiUdyPMkli2rWTCybKyOQN_2TilOK0aNx2KKNcC1X8Xd-XzFCBg/exec';

        document.getElementById('submitToSheetBtn').addEventListener('click', async function() {
            const submitBtn = this;

            const companyName = document.getElementById('companyName').value.trim();
            const contactPerson = document.getElementById('contactPerson').value.trim();
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            const emailAddress = document.getElementById('emailAddress').value.trim();
            const docYes = document.getElementById('documentsYes').checked;
            const docNo = document.getElementById('documentsNo').checked;
            const documentsProvided = docYes ? '有' : (docNo ? '無' : '未選擇');

            const sortedSelectedIds = selectedRequirementIds
                .filter(id => !!requirementQuestionMap[id])
                .slice()
                .sort((a, b) => requirementQuestionMap[a].order - requirementQuestionMap[b].order);

            if (sortedSelectedIds.length === 0) {
                alert('請先在樹狀圖中點選需要釐清的測量工項！');
                return;
            }

            if (!contactPerson && !phoneNumber && !emailAddress) {
                alert('請至少填寫聯絡人、電話或電子郵件，以便後續回覆！');
                return;
            }

            // G 欄保留為「所選工項摘要」；逐題問題與回答會另外傳至需求問答明細工作表。
            const selectedRequirementsText = sortedSelectedIds.map(id => {
                const item = requirementQuestionMap[id];
                return `${item.category} > ${item.subcategory} > ${item.name}`;
            }).join('\n');

            const questionDetails = [];
            sortedSelectedIds.forEach(id => {
                const item = requirementQuestionMap[id];
                (item.questions || []).forEach((question, questionIndex) => {
                    const answerKey = getRequirementAnswerKey(id, questionIndex);
                    questionDetails.push({
                        taskId: id,
                        category: item.category || '',
                        subcategory: item.subcategory || '',
                        taskName: item.name || '',
                        questionCode: String(question.label || `Q${questionIndex + 1}`).replace(/[.。]$/, ''),
                        questionText: String(question.text || ''),
                        answer: requirementAnswers[answerKey] || '',
                        answerLocked: !!requirementAnswerLocks[answerKey]
                    });
                });
            });

            submitBtn.disabled = true;
            submitBtn.textContent = '傳送中...';

            try {
                // 使用 URLSearchParams 送出 application/x-www-form-urlencoded，讓 Apps Script 的 e.parameter 可穩定讀取。
                const formData = new URLSearchParams();
                formData.append('companyName', companyName);
                formData.append('contactPerson', contactPerson);
                formData.append('phoneNumber', phoneNumber);
                formData.append('emailAddress', emailAddress);
                formData.append('documentsProvided', documentsProvided);
                formData.append('selectedRequirements', selectedRequirementsText);
                formData.append('questionDetails', JSON.stringify(questionDetails));

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`伺服器回應 HTTP ${response.status}`);
                }

                const result = await response.json();
                if (result.status === 'success') {
                    alert(`🎉 表單已成功送出！\n提交編號：${result.submissionId || '已建立'}\n逐題紀錄：${questionDetails.length} 題`);
                } else {
                    throw new Error(result.message || '未知錯誤');
                }
            } catch (error) {
                console.error('送出失敗:', error);
                alert('❌ 傳送失敗，請檢查 Google Apps Script 是否已更新並重新部署。\n詳細資訊：' + (error.message || '未知錯誤'));
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '確認送出表單';
            }
        });

        // 依 Excel 工項清單的列序，將 41 個末端節點綁定唯一 ID。
        // 這可讓原本尚未設定需求問題 ID 的工項也能被選取，並依來源順序排序。
        var requirementTaskIds = Object.keys(requirementQuestionMap).sort(function (a, b) {
            return requirementQuestionMap[a].order - requirementQuestionMap[b].order;
        });

        function assignRequirementIdsByTreeOrder(root) {
            var leafIndex = 0;
            function visit(node) {
                if (Array.isArray(node.children) && node.children.length > 0) {
                    node.children.forEach(visit);
                } else {
                    if (requirementTaskIds[leafIndex]) {
                        node.id = requirementTaskIds[leafIndex];
                    }
                    leafIndex += 1;
                }
            }
            visit(root);
            if (leafIndex !== requirementTaskIds.length) {
                console.warn('樹狀圖末端工項數量與問題統計表不一致：', leafIndex, requirementTaskIds.length);
            }
        }
        assignRequirementIdsByTreeOrder(treeData);

        // =========================================================
        // 統一各主分類子樹的連線顏色
        // A / B / C / D 以下所有節點沿用主分類色，避免 ECharts
        // 對沒有明確 lineStyle 的節點套用灰色預設值。
        // =========================================================
        function propagateBranchLineColor(node, branchColor) {
            if (!node) return;

            var currentColor = branchColor ||
                (node.lineStyle && node.lineStyle.color) ||
                (node.itemStyle && node.itemStyle.color) ||
                null;

            if (currentColor) {
                node.lineStyle = Object.assign({}, node.lineStyle || {}, {
                    color: currentColor
                });
            }

            if (Array.isArray(node.children)) {
                node.children.forEach(function (child) {
                    propagateBranchLineColor(child, currentColor);
                });
            }
        }

        if (Array.isArray(treeData.children)) {
            treeData.children.forEach(function (branch) {
                var branchColor =
                    (branch.lineStyle && branch.lineStyle.color) ||
                    (branch.itemStyle && branch.itemStyle.color);
                propagateBranchLineColor(branch, branchColor);
            });
        }

        // 根節點維持中性灰，A/B/C/D 子樹則使用各自主色。
        treeData.lineStyle = {
            color: '#c8c8c8',
            width: 4
        };

        // =========================================================
        // 需求釐清：選取狀態
        // =========================================================
        var requirementMode = true;
        var selectedRequirementIds = [];
        // 回覆與鎖定狀態均以「工項 ID + 題目序號」儲存；切換工項重繪便條紙時不會遺失。
        var requirementAnswers = {};
        var requirementAnswerLocks = {};

        function getRequirementAnswerKey(id, questionIndex) {
            return String(id) + '__Q' + String(questionIndex + 1);
        }

        var requirementToggleBtn = document.getElementById('requirementToggleBtn');
        var notePanel = document.getElementById('notePanel');
        var noteBody = document.getElementById('noteBody');
        var noteCounter = document.getElementById('noteCounter');
        var clearSelectedBtn = document.getElementById('clearSelectedBtn');

        // 深拷貝節點資料，依選取狀態更新外觀
        function cloneTreeData(obj) {
            return JSON.parse(JSON.stringify(obj));
        }

        function decorateSelectedNodes(node) {
            if (!node) return;

            if (node.id && requirementQuestionMap[node.id]) {
                var originalLabel = node.label || {};

                if (selectedRequirementIds.indexOf(node.id) !== -1) {
                    node.itemStyle = Object.assign({}, node.itemStyle || {}, {
                        color: '#fff7b3',
                        borderColor: '#d97706',
                        borderWidth: 3
                    });

                    node.label = Object.assign({}, originalLabel, {
                        color: '#6b4f00',
                        backgroundColor: '#fff7b3',
                        borderColor: '#d97706',
                        borderWidth: 2.5,
                        fontWeight: 'bold',
                        shadowBlur: 8,
                        shadowColor: 'rgba(217,119,6,0.28)'
                    });
                }
            }

            if (Array.isArray(node.children)) {
                node.children.forEach(decorateSelectedNodes);
            }
        }

        // 不再重新 setOption 整棵 tree。
        // 這是避免「點擊需求節點後樹狀圖自動收攏」的關鍵。
        // 需求選取狀態只由 selectedRequirementIds 管理，樹狀圖本身維持目前展開/縮合狀態。
        // 目前選取節點的 ECharts dataIndex。
        // 使用 ECharts 的 select / unselect state，而不是重新 setOption，
        // 因此不會讓整棵 Tree 重新建立，也不會破壞目前的展開/收合狀態。
        var selectedDataIndexMap = {};

        function applyNodeSelection(dataIndex, isSelected) {
            if (dataIndex === undefined || dataIndex === null) return;

            myChart.dispatchAction({
                type: isSelected ? 'select' : 'unselect',
                seriesIndex: 0,
                dataIndex: dataIndex
            });
        }

        function updateChartSelectionStyle() {
            // 需求節點的黃色樣式由 ECharts 的 select state 處理。
            // 刻意不重新 setOption，避免樹狀圖收攏、跳動或產生 Canvas 殘影。
        }

        function renderNotePanel() {
            var sortedIds = selectedRequirementIds
                .filter(function (id) { return !!requirementQuestionMap[id]; })
                .slice()
                .sort(function (a, b) {
                    return requirementQuestionMap[a].order - requirementQuestionMap[b].order;
                });

            noteCounter.textContent = '已選 ' + sortedIds.length + ' 項';

            if (sortedIds.length === 0) {
                noteBody.innerHTML = `
                    <div class="note-empty">
                        尚未選擇任何末端工項。<br>
                        請在需求釐清模式下點選節點。
                    </div>
                `;
                return;
            }

            var html = '';
            var lastCategory = '';
            var lastSubcategory = '';

            sortedIds.forEach(function (id) {
                var item = requirementQuestionMap[id];
                if (!item) return;

                if (item.category !== lastCategory) {
                    html += '<div class="note-category-heading ' + escapeHtml(item.categoryClass) + '">' +
                        escapeHtml(item.category) + '</div>';
                    lastCategory = item.category;
                    lastSubcategory = '';
                }

                if (item.subcategory !== lastSubcategory) {
                    html += '<div class="note-subcategory-heading">' +
                        escapeHtml(item.subcategory) + '</div>';
                    lastSubcategory = item.subcategory;
                }

                html += `
                    <section class="note-group">
                        <div class="note-group-title">
                            <span>${escapeHtml(item.name)}</span>
                            <button
                                type="button"
                                class="remove-item-btn"
                                data-remove-id="${escapeHtml(id)}"
                                title="移除此工項"
                                aria-label="移除此工項"
                            >✕</button>
                        </div>
                `;

                item.questions.forEach(function (question, questionIndex) {
                    var textHtml = escapeHtml(question.text).replace(/\r?\n/g, '<br>');
                    var answerKey = getRequirementAnswerKey(id, questionIndex);
                    var savedAnswer = requirementAnswers[answerKey] || '';
                    var isLocked = !!requirementAnswerLocks[answerKey];
                    var lockButtonClass = isLocked ? 'note-answer-lock-btn is-locked' : 'note-answer-lock-btn';
                    var textareaClass = isLocked ? 'note-answer-input is-locked' : 'note-answer-input';
                    var lockButtonText = isLocked ? '🔓 解除鎖定' : '🔒 鎖定內容';
                    var lockStatusText = isLocked ? '已鎖定，避免誤改' : '尚未鎖定';
                    html += `
                        <div class="note-question-block">
                            <div class="note-question"><code>${escapeHtml(question.label)}</code> ${textHtml}</div>
                            <label class="note-answer-label" for="answer-${escapeHtml(answerKey)}">業主回覆</label>
                            <textarea
                                id="answer-${escapeHtml(answerKey)}"
                                class="${textareaClass}"
                                data-answer-key="${escapeHtml(answerKey)}"
                                rows="2"
                                placeholder="請輸入業主回覆（可留白）"
                                aria-label="${escapeHtml(question.label)} 業主回覆"
                                ${isLocked ? 'readonly aria-readonly="true"' : ''}
                            >${escapeHtml(savedAnswer)}</textarea>
                            <div class="note-answer-actions">
                                <button
                                    type="button"
                                    class="${lockButtonClass}"
                                    data-lock-answer-key="${escapeHtml(answerKey)}"
                                    aria-pressed="${String(isLocked)}"
                                    title="${isLocked ? '解除鎖定後才能編輯' : '鎖定後可避免不小心更改文字'}"
                                >${lockButtonText}</button>
                                <span class="note-answer-lock-status ${isLocked ? 'is-locked' : ''}">${lockStatusText}</span>
                            </div>
                        </div>
                    `;
                });

                html += '</section>';
            });

            noteBody.innerHTML = html;
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function removeRequirement(id) {
            if (Object.prototype.hasOwnProperty.call(selectedDataIndexMap, id)) {
                applyNodeSelection(selectedDataIndexMap[id], false);
                delete selectedDataIndexMap[id];
            }

            selectedRequirementIds = selectedRequirementIds.filter(function (item) {
                return item !== id;
            });

            renderNotePanel();
            updateChartSelectionStyle();
        }

        function clearAllRequirements() {
            var hasAnswers = Object.keys(requirementAnswers).some(function (key) {
                return String(requirementAnswers[key] || '').trim() !== '';
            });
            var hasLocks = Object.keys(requirementAnswerLocks).some(function (key) {
                return !!requirementAnswerLocks[key];
            });

            if ((selectedRequirementIds.length > 0 || hasAnswers || hasLocks) &&
                !window.confirm('確定要清除所有已選工項、業主回覆及鎖定狀態嗎？此操作無法復原。')) {
                return;
            }

            selectedRequirementIds.forEach(function (id) {
                if (Object.prototype.hasOwnProperty.call(selectedDataIndexMap, id)) {
                    applyNodeSelection(selectedDataIndexMap[id], false);
                }
            });

            selectedDataIndexMap = {};
            selectedRequirementIds = [];
            requirementAnswers = {};
            requirementAnswerLocks = {};
            renderNotePanel();
            updateChartSelectionStyle();
        }

        // 使用事件委派即時保存每一題的輸入，避免新增／移除工項導致便條紙重繪時清空內容。
        noteBody.addEventListener('input', function (event) {
            var textarea = event.target.closest('.note-answer-input');
            if (!textarea) return;

            var answerKey = textarea.getAttribute('data-answer-key');
            if (answerKey) {
                requirementAnswers[answerKey] = textarea.value;
            }
        });

        noteBody.addEventListener('click', function (event) {
            var lockButton = event.target.closest('.note-answer-lock-btn');
            if (lockButton) {
                var answerKey = lockButton.getAttribute('data-lock-answer-key');
                if (!answerKey) return;

                if (requirementAnswerLocks[answerKey]) {
                    if (!window.confirm('此回答目前已鎖定。確定要解除鎖定並允許編輯嗎？')) {
                        return;
                    }
                    requirementAnswerLocks[answerKey] = false;
                } else {
                    requirementAnswerLocks[answerKey] = true;
                }

                renderNotePanel();
                return;
            }

            var removeButton = event.target.closest('.remove-item-btn');
            if (!removeButton) return;

            var id = removeButton.getAttribute('data-remove-id');
            if (id) {
                removeRequirement(id);
            }
        });

        // 左下角方形按鈕：同步切換需求釐清模式與右側便條紙顯示狀態。
        function setRequirementMode(enabled) {
            requirementMode = !!enabled;
            notePanel.classList.toggle('hidden', !requirementMode);
            requirementToggleBtn.classList.toggle('active', requirementMode);
            requirementToggleBtn.setAttribute('aria-pressed', String(requirementMode));
            requirementToggleBtn.title = '關閉 / 開啟測量需求釐清';
            requirementToggleBtn.setAttribute('data-tooltip', '關閉 / 開啟測量需求釐清');

            if (requirementMode) {
                renderNotePanel();
            }
        }

        requirementToggleBtn.addEventListener('click', function () {
            setRequirementMode(!requirementMode);
        });

        clearSelectedBtn.addEventListener('click', function () {
            clearAllRequirements();
        });

        // 便條紙採固定位置與固定尺寸，不提供拖曳或縮放功能。

        // =========================================================
        // ECharts 設定
        // =========================================================
        var option = {
            // 保留 Tree 展開／收攏動畫；Canvas 明確關閉 dirty-rect，避免局部重繪造成線段殘影。
            animation: true,
            animationDuration: 300,
            animationDurationUpdate: 500,
            animationEasing: 'cubicOut',
            animationEasingUpdate: 'cubicOut',
            stateAnimation: { duration: 120 },
            toolbox: {
                show: true,
                feature: {
                    saveAsImage: {
                        title: '下載為圖片',
                        name: '空間測量業務樹狀圖',
                        pixelRatio: 2
                    }
                },
                right: 30,
                top: 20
            },

            tooltip: {
                trigger: 'item',
                triggerOn: 'mousemove',
                backgroundColor: 'rgba(255,255,255,0.95)',
                borderColor: '#ccc',
                textStyle: {
                    color: '#333',
                    fontSize: 14
                },
                formatter: function (info) {
                    var selected = info.data && info.data.id &&
                        selectedRequirementIds.indexOf(info.data.id) !== -1;

                    var prefix = (requirementMode && info.data && info.data.id && requirementQuestionMap[info.data.id])
                        ? (selected ? '✅ 已選：' : '📝 點擊加入：')
                        : '';

                    return '<b>' + prefix + escapeHtml(String(info.name).replace(/\n/g, ' ')) + '</b>';
                }
            },

            series: [
                {
                    type: 'tree',
                    data: [treeData],
                    selectedMode: 'multiple',
                    select: {
                        itemStyle: {
                            color: '#fff8a8',
                            borderColor: '#d8c85a',
                            borderWidth: 2.5
                        },
                        label: {
                            color: '#333333'
                        }
                    },
                    orient: 'TB',
                    roam: true,
                    initialTreeDepth: 2,

                    left: '2%',
                    right: '2%',
                    top: '8%',
                    bottom: '10%',

                    symbol: 'emptyCircle',
                    symbolSize: 14,

                    edgeShape: 'polyline',
                    edgeForkPosition: '60%',

                    lineStyle: {
                        width: 4,
                        curveness: 0
                    },

                    label: {
                        position: 'top',
                        verticalAlign: 'middle',
                        align: 'center',
                        fontSize: 16,
                        fontFamily: 'Noto Sans TC',
                        distance: 12
                    },

                    leaves: {
                        label: {
                            position: 'bottom',
                            verticalAlign: 'top',
                            align: 'center',
                            distance: 12,
                            fontSize: 15,
                            backgroundColor: '#f9f9f9',
                            padding: [6, 10],
                            borderRadius: 4,
                            borderWidth: 1,
                            borderColor: '#e0e0e0'
                        }
                    },

                    // 保留原本的展開／收攏動畫。
                    animation: true,
                    animationDuration: 300,
                    animationDurationUpdate: 500,
                    animationEasing: 'cubicOut',
                    animationEasingUpdate: 'cubicOut'
                }
            ]
        };

        myChart.setOption(option);
        setRequirementMode(true);

        // =========================================================
        // Tree 展開／收攏後的保護性完整刷新
        // 保留 500ms 的動畫，動畫結束後再做一次完整 renderer refresh，
        // 清除偶發的舊線段繪製痕跡，但不改變節點的展開狀態。
        // =========================================================
        var treeRefreshTimer = null;
        myChart.on('treeexpandandcollapse', function () {
            if (treeRefreshTimer) {
                clearTimeout(treeRefreshTimer);
            }

            treeRefreshTimer = setTimeout(function () {
                if (myChart && !myChart.isDisposed()) {
                    myChart.getZr().refreshImmediately();
                }
            }, 560);
        });

        // =========================================================
        // 最末端節點點擊：只有在需求釐清模式下才加入 / 取消
        // =========================================================
        myChart.on('click', function (params) {
            var node = params.data || {};
            var id = node.id;

            // 需求釐清模式關閉時，不讓 ECharts 的 selected state 留下任何黃色。
            if (!requirementMode) {
                applyNodeSelection(params.dataIndex, false);
                return;
            }

            // 需求釐清模式開啟時，也只允許「有需求問題的最末端節點」被選取。
            if (!id || !requirementQuestionMap[id]) {
                applyNodeSelection(params.dataIndex, false);
                return;
            }

            var index = selectedRequirementIds.indexOf(id);

            // 保存該節點的 dataIndex，讓移除／清除時可以精準取消黃色選取狀態。
            selectedDataIndexMap[id] = params.dataIndex;

            if (index === -1) {
                selectedRequirementIds.push(id);
                applyNodeSelection(params.dataIndex, true);
            } else {
                // 再次點擊 = 取消選取
                selectedRequirementIds.splice(index, 1);
                applyNodeSelection(params.dataIndex, false);
                delete selectedDataIndexMap[id];
            }

            renderNotePanel();
            updateChartSelectionStyle();
        });

        // 視窗載入完成後，自動將卷軸移動到 3600px 畫布的最中心
        window.onload = function () {
            var scrollWrap = document.getElementById('scrollWrap');
            scrollWrap.scrollLeft = (scrollWrap.scrollWidth - scrollWrap.clientWidth) / 2;
        };

        window.addEventListener('resize', function () {
            myChart.resize();
        });
    </script>
</body>
</html>
